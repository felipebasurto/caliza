<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="Caliza layered software architecture showing presentation surfaces, backend snapshot and command contract, core services, and the PCSX2 and Orbis layers">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#05071A"/>
      <stop offset="50%" stop-color="#090E30"/>
      <stop offset="100%" stop-color="#05081E"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="44%" r="50%">
      <stop offset="0%" stop-color="#3340D0" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#05071A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bus" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#13235C"/>
      <stop offset="50%" stop-color="#1D3682"/>
      <stop offset="100%" stop-color="#13235C"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0E1540" stop-opacity="0.94"/>
      <stop offset="100%" stop-color="#080C26" stop-opacity="0.94"/>
    </linearGradient>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="1199" height="599" rx="18" fill="url(#bg)" stroke="#8C9BFF" stroke-opacity="0.26"/>
  <rect x="1" y="1" width="1198" height="598" rx="18" fill="url(#glow)"/>

  <!-- Header -->
  <text x="48" y="46" class="sans" font-size="12" font-weight="700" letter-spacing="1.8" fill="#A5E7FF">SYSTEM ARCHITECTURE</text>
  <text x="48" y="72" class="sans" font-size="22" font-weight="600" fill="#F2F5FF">Thin Presentation Over a Single Backend Contract</text>
  <text x="1152" y="68" text-anchor="end" class="mono" font-size="12" fill="#A3ACDA">caliza/core/contract.h</text>
  <line x1="48" y1="88" x2="1152" y2="88" stroke="#8C9BFF" stroke-opacity="0.24"/>

  <!-- LAYER 1: PRESENTATION -->
  <text x="48" y="114" class="sans" font-size="11.5" font-weight="700" letter-spacing="1.4" fill="#8E98CA">LAYER 1 · PRESENTATION (READ-ONLY SNAPSHOT CONSUMERS)</text>

  <g transform="translate(48, 126)">
    <rect width="540" height="94" rx="12" fill="url(#card)" stroke="#8C9BFF" stroke-opacity="0.34"/>
    <rect x="0.5" y="16" width="3.5" height="36" rx="1.75" fill="#A5E7FF"/>
    <text x="20" y="30" class="sans" font-size="16" font-weight="600" fill="#F2F5FF">Estratos Native Vulkan UI</text>
    <text x="520" y="30" text-anchor="end" class="mono" font-size="11.5" fill="#A5E7FF">caliza/native/</text>
    <text x="20" y="54" class="sans" font-size="12.5" fill="#A3ACDA">2D Vulkan draw list, SDF fonts, procedural glass-strata backdrop, 10-foot focus model,</text>
    <text x="20" y="74" class="sans" font-size="12.5" fill="#A3ACDA">accessibility scaling (100–200%), and headless host preview captures.</text>
  </g>

  <g transform="translate(612, 126)">
    <rect width="540" height="94" rx="12" fill="url(#card)" stroke="#8C9BFF" stroke-opacity="0.34"/>
    <rect x="0.5" y="16" width="3.5" height="36" rx="1.75" fill="#6F95FF"/>
    <text x="20" y="30" class="sans" font-size="16" font-weight="600" fill="#F2F5FF">Companion Web Panel</text>
    <text x="520" y="30" text-anchor="end" class="mono" font-size="11.5" fill="#A5E7FF">caliza/web/</text>
    <text x="20" y="54" class="sans" font-size="12.5" fill="#A3ACDA">Console-hosted HTTPS panel for phones and computers on the local network.</text>
    <text x="20" y="74" class="sans" font-size="12.5" fill="#A3ACDA">Shares the exact same settings catalog and validation rules as the TV interface.</text>
  </g>

  <!-- Connectors Layer 1 <-> Contract (no text crossed) -->
  <g stroke="#A5E7FF" stroke-opacity="0.65" stroke-width="1.8">
    <line x1="318" y1="220" x2="318" y2="244"/>
    <line x1="882" y1="220" x2="882" y2="244"/>
  </g>
  <circle cx="318" cy="244" r="3" fill="#A5E7FF"/>
  <circle cx="882" cy="244" r="3" fill="#A5E7FF"/>

  <!-- CONTRACT BUS -->
  <g transform="translate(48, 244)">
    <rect width="1104" height="50" rx="11" fill="url(#bus)" stroke="#A5E7FF" stroke-opacity="0.65" stroke-width="1.3"/>
    <text x="22" y="30" class="sans" font-size="14" font-weight="700" fill="#F2F5FF">Backend Command Contract</text>
    <rect x="260" y="11" width="366" height="28" rx="14" fill="#0B143B" stroke="#72E3B5" stroke-opacity="0.55"/>
    <text x="443" y="29" text-anchor="middle" class="mono" font-size="11.5" fill="#72E3B5">↑ Immutable Snapshot &amp; BrowseFolder()</text>
    <rect x="646" y="11" width="436" height="28" rx="14" fill="#0B143B" stroke="#FFD092" stroke-opacity="0.55"/>
    <text x="864" y="29" text-anchor="middle" class="mono" font-size="11.5" fill="#FFD092">↓ Queued Command Mutations (settings, scan, boot, saves)</text>
  </g>

  <!-- Clean flow divider into Layer 2 -->
  <g stroke="#8C9BFF" stroke-opacity="0.45" stroke-width="1.5">
    <line x1="600" y1="294" x2="600" y2="309"/>
  </g>
  <polygon points="595,307 605,307 600,314" fill="#A5E7FF" fill-opacity="0.8"/>

  <!-- LAYER 2: PORTABLE CORE SERVICES -->
  <text x="48" y="330" class="sans" font-size="11.5" font-weight="700" letter-spacing="1.4" fill="#8E98CA">LAYER 2 · PORTABLE CALIZA SERVICES (HOST-TESTABLE ON MACOS &amp; LINUX)</text>

  <g transform="translate(48, 342)">
    <rect x="0" y="0" width="261" height="92" rx="11" fill="url(#card)" stroke="#8C9BFF" stroke-opacity="0.30"/>
    <text x="16" y="26" class="sans" font-size="14" font-weight="600" fill="#F2F5FF">Settings Schema</text>
    <text x="16" y="45" class="mono" font-size="11" fill="#A5E7FF">settings_schema.cpp</text>
    <text x="16" y="65" class="sans" font-size="11.8" fill="#A3ACDA">112 visible options, global &amp; per-game</text>
    <text x="16" y="81" class="sans" font-size="11.8" fill="#A3ACDA">.ini projection, atomic file writes.</text>

    <rect x="281" y="0" width="261" height="92" rx="11" fill="url(#card)" stroke="#8C9BFF" stroke-opacity="0.30"/>
    <text x="297" y="26" class="sans" font-size="14" font-weight="600" fill="#F2F5FF">Storage &amp; Scanner</text>
    <text x="297" y="45" class="mono" font-size="11" fill="#A5E7FF">storage.cpp</text>
    <text x="297" y="65" class="sans" font-size="11.8" fill="#A3ACDA">Cancelable background scans across</text>
    <text x="297" y="81" class="sans" font-size="11.8" fill="#A3ACDA">internal, USB, extended &amp; NFS roots.</text>

    <rect x="562" y="0" width="261" height="92" rx="11" fill="url(#card)" stroke="#8C9BFF" stroke-opacity="0.30"/>
    <text x="578" y="26" class="sans" font-size="14" font-weight="600" fill="#F2F5FF">Safe Migration</text>
    <text x="578" y="45" class="mono" font-size="11" fill="#A5E7FF">data_root.cpp</text>
    <text x="578" y="65" class="sans" font-size="11.8" fill="#A3ACDA">Resumable first-run copy into</text>
    <text x="578" y="81" class="sans" font-size="11.8" fill="#A3ACDA">/data/caliza; source stays intact.</text>

    <rect x="843" y="0" width="261" height="92" rx="11" fill="url(#card)" stroke="#8C9BFF" stroke-opacity="0.30"/>
    <text x="859" y="26" class="sans" font-size="14" font-weight="600" fill="#F2F5FF">Console Backend</text>
    <text x="859" y="45" class="mono" font-size="11" fill="#A5E7FF">console_backend.cpp</text>
    <text x="859" y="65" class="sans" font-size="11.8" fill="#A3ACDA">Memory cards, patches, texture packs,</text>
    <text x="859" y="81" class="sans" font-size="11.8" fill="#A3ACDA">Smart Tune &amp; VM boot handoff.</text>
  </g>

  <!-- Clean flow divider into Layer 3 -->
  <g stroke="#8C9BFF" stroke-opacity="0.45" stroke-width="1.5">
    <line x1="600" y1="434" x2="600" y2="449"/>
  </g>
  <polygon points="595,447 605,447 600,454" fill="#A5E7FF" fill-opacity="0.8"/>

  <!-- LAYER 3: EMULATION CORE & CONSOLE PLATFORM -->
  <text x="48" y="470" class="sans" font-size="11.5" font-weight="700" letter-spacing="1.4" fill="#8E98CA">LAYER 3 · EMULATION CORE &amp; PS4 RUNTIME (LINKED VIA OPENORBIS)</text>

  <g transform="translate(48, 482)">
    <rect x="0" y="0" width="352" height="84" rx="11" fill="#0B1136" stroke="#6F95FF" stroke-opacity="0.42"/>
    <text x="16" y="26" class="sans" font-size="14.5" font-weight="600" fill="#F2F5FF">PCSX2 Emulation Core</text>
    <text x="336" y="26" text-anchor="end" class="mono" font-size="11" fill="#A5E7FF">pcsx2/ · common/</text>
    <text x="16" y="48" class="sans" font-size="12" fill="#A3ACDA">EE, IOP, VU0/VU1, MTVU, GS, SPU2, CDVD,</text>
    <text x="16" y="66" class="sans" font-size="12" fill="#A3ACDA">memory cards, save states &amp; GameDB patches.</text>

    <rect x="376" y="0" width="352" height="84" rx="11" fill="#0B1136" stroke="#6F95FF" stroke-opacity="0.42"/>
    <text x="392" y="26" class="sans" font-size="14.5" font-weight="600" fill="#F2F5FF">PS4 Target &amp; Vulkan</text>
    <text x="712" y="26" text-anchor="end" class="mono" font-size="11" fill="#A5E7FF">ps4/</text>
    <text x="392" y="48" class="sans" font-size="12" fill="#A3ACDA">Mesa RADV Vulkan driver, WSI swapchain shim,</text>
    <text x="392" y="66" class="sans" font-size="12" fill="#A3ACDA">optional paraLLEl-GS, crash hooks &amp; packaging.</text>

    <rect x="752" y="0" width="352" height="84" rx="11" fill="#0B1136" stroke="#6F95FF" stroke-opacity="0.42"/>
    <text x="768" y="26" class="sans" font-size="14.5" font-weight="600" fill="#F2F5FF">Orbis Platform Services</text>
    <text x="1088" y="26" text-anchor="end" class="mono" font-size="11" fill="#A5E7FF">Orbis layer</text>
    <text x="768" y="48" class="sans" font-size="12" fill="#A3ACDA">Direct memory &amp; JIT probe, controller hotplug,</text>
    <text x="768" y="66" class="sans" font-size="12" fill="#A3ACDA">audio output, mbedTLS HTTPS &amp; NFSv3 client.</text>
  </g>

  <text x="600" y="586" text-anchor="middle" class="sans" font-size="11.5" fill="#7D88BC">Fast host tests verify Layers 1–2 on macOS and Linux · Hardware validation on real PS4 consoles is tracked separately in ps4/STATUS.md</text>
</svg>
