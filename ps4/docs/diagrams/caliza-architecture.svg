<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 572" width="1200" height="572" role="img" aria-label="Caliza architecture showing the Vulkan interface, companion web panel, backend command contract, core services, and PCSX2 and Orbis runtime layers">
  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="1199" height="571" rx="16" fill="#06081F" stroke="#8C9BFF" stroke-opacity="0.26"/>

  <!-- Header -->
  <text x="48" y="48" class="sans" font-size="20" font-weight="600" fill="#F2F5FF">Caliza architecture</text>
  <text x="1152" y="48" text-anchor="end" class="mono" font-size="12" fill="#A3ACDA">caliza/core/contract.h</text>
  <line x1="48" y1="68" x2="1152" y2="68" stroke="#8C9BFF" stroke-opacity="0.22"/>

  <!-- Layer 1 -->
  <text x="48" y="96" class="sans" font-size="13" font-weight="600" fill="#A3ACDA">Presentation</text>

  <g transform="translate(48, 108)">
    <rect width="540" height="92" rx="10" fill="#0B1033" stroke="#8C9BFF" stroke-opacity="0.30"/>
    <text x="20" y="30" class="sans" font-size="15.5" font-weight="600" fill="#F2F5FF">Estratos Vulkan UI</text>
    <text x="520" y="30" text-anchor="end" class="mono" font-size="11.5" fill="#A5E7FF">caliza/native/</text>
    <text x="20" y="54" class="sans" font-size="12.5" fill="#A3ACDA">2D Vulkan draw list, SDF fonts, gamepad navigation, text scaling from 100%</text>
    <text x="20" y="72" class="sans" font-size="12.5" fill="#A3ACDA">to 200%, and headless host preview captures.</text>
  </g>

  <g transform="translate(612, 108)">
    <rect width="540" height="92" rx="10" fill="#0B1033" stroke="#8C9BFF" stroke-opacity="0.30"/>
    <text x="20" y="30" class="sans" font-size="15.5" font-weight="600" fill="#F2F5FF">Companion web panel</text>
    <text x="520" y="30" text-anchor="end" class="mono" font-size="11.5" fill="#A5E7FF">caliza/web/</text>
    <text x="20" y="54" class="sans" font-size="12.5" fill="#A3ACDA">Console-hosted HTTPS panel for phones and computers on the local network.</text>
    <text x="20" y="72" class="sans" font-size="12.5" fill="#A3ACDA">Uses the same settings catalog and validation rules as the TV interface.</text>
  </g>

  <g stroke="#A5E7FF" stroke-opacity="0.65" stroke-width="1.6">
    <line x1="318" y1="200" x2="318" y2="224"/>
    <line x1="882" y1="200" x2="882" y2="224"/>
  </g>

  <!-- Backend contract bus -->
  <g transform="translate(48, 224)">
    <rect width="1104" height="48" rx="10" fill="#14235B" stroke="#7AA8FF" stroke-opacity="0.60" stroke-width="1.2"/>
    <text x="20" y="29" class="sans" font-size="14" font-weight="600" fill="#F2F5FF">Backend contract</text>
    <rect x="200" y="10" width="380" height="28" rx="6" fill="#0B143B" stroke="#72E3B5" stroke-opacity="0.48"/>
    <text x="390" y="28" text-anchor="middle" class="mono" font-size="11.5" fill="#72E3B5">Reads: Snapshot and BrowseFolder()</text>
    <rect x="600" y="10" width="484" height="28" rx="6" fill="#0B143B" stroke="#FFD092" stroke-opacity="0.48"/>
    <text x="842" y="28" text-anchor="middle" class="mono" font-size="11.5" fill="#FFD092">Writes: queued Commands (settings, scan, boot, saves)</text>
  </g>

  <line x1="600" y1="272" x2="600" y2="290" stroke="#8C9BFF" stroke-opacity="0.50" stroke-width="1.5"/>
  <polygon points="595,288 605,288 600,295" fill="#A5E7FF" fill-opacity="0.8"/>

  <!-- Layer 2 -->
  <text x="48" y="312" class="sans" font-size="13" font-weight="600" fill="#A3ACDA">Core services</text>

  <g transform="translate(48, 324)">
    <rect x="0" y="0" width="261" height="90" rx="10" fill="#0B1033" stroke="#8C9BFF" stroke-opacity="0.28"/>
    <text x="16" y="26" class="sans" font-size="14" font-weight="600" fill="#F2F5FF">Settings schema</text>
    <text x="16" y="44" class="mono" font-size="11" fill="#A5E7FF">settings_schema.cpp</text>
    <text x="16" y="64" class="sans" font-size="11.8" fill="#A3ACDA">112 options, global and per-game</text>
    <text x="16" y="80" class="sans" font-size="11.8" fill="#A3ACDA">.ini files, atomic writes.</text>

    <rect x="281" y="0" width="261" height="90" rx="10" fill="#0B1033" stroke="#8C9BFF" stroke-opacity="0.28"/>
    <text x="297" y="26" class="sans" font-size="14" font-weight="600" fill="#F2F5FF">Storage and scanner</text>
    <text x="297" y="44" class="mono" font-size="11" fill="#A5E7FF">storage.cpp</text>
    <text x="297" y="64" class="sans" font-size="11.8" fill="#A3ACDA">Cancelable scans for internal, USB,</text>
    <text x="297" y="80" class="sans" font-size="11.8" fill="#A3ACDA">extended, and NFSv3 folders.</text>

    <rect x="562" y="0" width="261" height="90" rx="10" fill="#0B1033" stroke="#8C9BFF" stroke-opacity="0.28"/>
    <text x="578" y="26" class="sans" font-size="14" font-weight="600" fill="#F2F5FF">Upgrade migration</text>
    <text x="578" y="44" class="mono" font-size="11" fill="#A5E7FF">data_root.cpp</text>
    <text x="578" y="64" class="sans" font-size="11.8" fill="#A3ACDA">Resumable first-run copy into</text>
    <text x="578" y="80" class="sans" font-size="11.8" fill="#A3ACDA">/data/caliza without deleting old data.</text>

    <rect x="843" y="0" width="261" height="90" rx="10" fill="#0B1033" stroke="#8C9BFF" stroke-opacity="0.28"/>
    <text x="859" y="26" class="sans" font-size="14" font-weight="600" fill="#F2F5FF">Console backend</text>
    <text x="859" y="44" class="mono" font-size="11" fill="#A5E7FF">console_backend.cpp</text>
    <text x="859" y="64" class="sans" font-size="11.8" fill="#A3ACDA">Memory cards, patches, texture</text>
    <text x="859" y="80" class="sans" font-size="11.8" fill="#A3ACDA">packs, Smart Tune, and VM launch.</text>
  </g>

  <line x1="600" y1="414" x2="600" y2="432" stroke="#8C9BFF" stroke-opacity="0.50" stroke-width="1.5"/>
  <polygon points="595,430 605,430 600,437" fill="#A5E7FF" fill-opacity="0.8"/>

  <!-- Layer 3 -->
  <text x="48" y="454" class="sans" font-size="13" font-weight="600" fill="#A3ACDA">Emulation core and PS4 runtime</text>

  <g transform="translate(48, 466)">
    <rect x="0" y="0" width="352" height="72" rx="10" fill="#0B1033" stroke="#6F95FF" stroke-opacity="0.38"/>
    <text x="16" y="26" class="sans" font-size="14" font-weight="600" fill="#F2F5FF">PCSX2 core</text>
    <text x="336" y="26" text-anchor="end" class="mono" font-size="11" fill="#A5E7FF">pcsx2/, common/</text>
    <text x="16" y="48" class="sans" font-size="12" fill="#A3ACDA">EE, IOP, VU, MTVU, GS, SPU2, CDVD, and GameDB.</text>

    <rect x="376" y="0" width="352" height="72" rx="10" fill="#0B1033" stroke="#6F95FF" stroke-opacity="0.38"/>
    <text x="392" y="26" class="sans" font-size="14" font-weight="600" fill="#F2F5FF">PS4 Vulkan and packaging</text>
    <text x="712" y="26" text-anchor="end" class="mono" font-size="11" fill="#A5E7FF">ps4/</text>
    <text x="392" y="48" class="sans" font-size="12" fill="#A3ACDA">Mesa RADV, WSI shim, paraLLEl-GS, and OpenOrbis pkg.</text>

    <rect x="752" y="0" width="352" height="72" rx="10" fill="#0B1033" stroke="#6F95FF" stroke-opacity="0.38"/>
    <text x="768" y="26" class="sans" font-size="14" font-weight="600" fill="#F2F5FF">Orbis platform services</text>
    <text x="1088" y="26" text-anchor="end" class="mono" font-size="11" fill="#A5E7FF">Orbis layer</text>
    <text x="768" y="48" class="sans" font-size="12" fill="#A3ACDA">JIT probe, pad hotplug, audio, HTTPS, and NFSv3.</text>
  </g>

  <text x="600" y="558" text-anchor="middle" class="sans" font-size="11.5" fill="#7D88BC">Host tests cover the UI and core services on macOS and Linux. PS4 builds link the core and platform layers with OpenOrbis.</text>
</svg>
