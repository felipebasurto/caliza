<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 428" width="1200" height="428" role="img" aria-label="Caliza storage layout under /data/caliza showing read-only external folders and upgrade migration">
  <defs>
    <marker id="arrIce" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#A5E7FF"/>
    </marker>
    <marker id="arrAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#FFD092"/>
    </marker>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="1199" height="427" rx="16" fill="#06081F" stroke="#8C9BFF" stroke-opacity="0.26"/>

  <!-- Header -->
  <text x="48" y="48" class="sans" font-size="20" font-weight="600" fill="#F2F5FF">Storage layout and upgrade migration</text>
  <line x1="48" y1="68" x2="1152" y2="68" stroke="#8C9BFF" stroke-opacity="0.22"/>

  <!-- Left card A: External and network game folders -->
  <g transform="translate(48, 88)">
    <rect width="450" height="140" rx="10" fill="#0B1033" stroke="#8C9BFF" stroke-opacity="0.30"/>
    <text x="20" y="30" class="sans" font-size="15" font-weight="600" fill="#F2F5FF">External and network game folders</text>
    <text x="20" y="50" class="mono" font-size="11.5" fill="#A5E7FF">/mnt/usb0, /mnt/ext0, nfs://server/export</text>
    <text x="20" y="78" class="sans" font-size="12.5" fill="#C9D3EC">Saved folders link to discs instead of copying them.</text>
    <text x="20" y="100" class="sans" font-size="12.5" fill="#C9D3EC">Scanning never writes to or formats a drive.</text>
    <text x="20" y="122" class="sans" font-size="12.5" fill="#C9D3EC">Unplugged drives keep their saved folder entries.</text>
  </g>

  <!-- Left card B: Upgrading from earlier builds -->
  <g transform="translate(48, 248)">
    <rect width="450" height="140" rx="10" fill="#0B1033" stroke="#8C9BFF" stroke-opacity="0.30"/>
    <text x="20" y="30" class="sans" font-size="15" font-weight="600" fill="#F2F5FF">Upgrading from earlier builds</text>
    <text x="20" y="56" class="sans" font-size="12.5" fill="#C9D3EC">First launch copies BIOS, settings, cards, and patches.</text>
    <text x="20" y="78" class="sans" font-size="12.5" fill="#C9D3EC">Interrupted copies resume on the next boot.</text>
    <text x="20" y="100" class="sans" font-size="12.5" fill="#C9D3EC">Existing files in /data/caliza/ are never overwritten.</text>
    <text x="20" y="122" class="sans" font-size="12.5" fill="#C9D3EC">Old folders are never deleted and games stay in place.</text>
  </g>

  <!-- Connectors -->
  <g>
    <line x1="500" y1="158" x2="574" y2="158" stroke="#A5E7FF" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrIce)"/>
    <text x="537" y="146" text-anchor="middle" class="sans" font-size="11" font-weight="600" fill="#A5E7FF">Read-only</text>

    <line x1="500" y1="318" x2="574" y2="318" stroke="#FFD092" stroke-width="1.8" marker-end="url(#arrAmber)"/>
    <text x="537" y="306" text-anchor="middle" class="sans" font-size="10.5" font-weight="600" fill="#FFD092">Copy once</text>
  </g>

  <!-- Right panel: /data/caliza/ -->
  <g transform="translate(578, 88)">
    <rect width="574" height="300" rx="12" fill="#0E1540" stroke="#7AA8FF" stroke-opacity="0.58" stroke-width="1.2"/>
    <text x="20" y="32" class="mono" font-size="16" font-weight="600" fill="#F2F5FF">/data/caliza/</text>
    <line x1="20" y1="46" x2="554" y2="46" stroke="#8C9BFF" stroke-opacity="0.20"/>

    <g transform="translate(20, 58)">
      <rect x="0" y="0" width="260" height="48" rx="6" fill="#0B1033" stroke="#8C9BFF" stroke-opacity="0.22"/>
      <text x="12" y="20" class="mono" font-size="13" font-weight="600" fill="#A5E7FF">bios/</text>
      <text x="12" y="38" class="sans" font-size="11.5" fill="#A3ACDA">User-dumped PS2 BIOS images</text>

      <rect x="274" y="0" width="260" height="48" rx="6" fill="#0B1033" stroke="#8C9BFF" stroke-opacity="0.22"/>
      <text x="286" y="20" class="mono" font-size="13" font-weight="600" fill="#A5E7FF">games/</text>
      <text x="286" y="38" class="sans" font-size="11.5" fill="#A3ACDA">Default internal game folder</text>

      <rect x="0" y="60" width="260" height="48" rx="6" fill="#0B1033" stroke="#8C9BFF" stroke-opacity="0.22"/>
      <text x="12" y="80" class="mono" font-size="13" font-weight="600" fill="#A5E7FF">memcards/</text>
      <text x="12" y="98" class="sans" font-size="11.5" fill="#A3ACDA">Global and per-game memory cards</text>

      <rect x="274" y="60" width="260" height="48" rx="6" fill="#0B1033" stroke="#8C9BFF" stroke-opacity="0.22"/>
      <text x="286" y="80" class="mono" font-size="13" font-weight="600" fill="#A5E7FF">savestates/</text>
      <text x="286" y="98" class="sans" font-size="11.5" fill="#A3ACDA">Save-state slots and backups</text>

      <rect x="0" y="120" width="260" height="48" rx="6" fill="#0B1033" stroke="#8C9BFF" stroke-opacity="0.22"/>
      <text x="12" y="140" class="mono" font-size="13" font-weight="600" fill="#A5E7FF">settings/</text>
      <text x="12" y="158" class="sans" font-size="11.5" fill="#A3ACDA">Global and per-game .ini files</text>

      <rect x="274" y="120" width="260" height="48" rx="6" fill="#0B1033" stroke="#8C9BFF" stroke-opacity="0.22"/>
      <text x="286" y="140" class="mono" font-size="13" font-weight="600" fill="#A5E7FF">patches/</text>
      <text x="286" y="158" class="sans" font-size="11.5" fill="#A3ACDA">Widescreen and game-fix patches</text>

      <rect x="0" y="180" width="260" height="48" rx="6" fill="#0B1033" stroke="#8C9BFF" stroke-opacity="0.22"/>
      <text x="12" y="200" class="mono" font-size="13" font-weight="600" fill="#A5E7FF">textures/</text>
      <text x="12" y="218" class="sans" font-size="11.5" fill="#A3ACDA">Texture replacement packs</text>

      <rect x="274" y="180" width="260" height="48" rx="6" fill="#0B1033" stroke="#8C9BFF" stroke-opacity="0.22"/>
      <text x="286" y="200" class="mono" font-size="13" font-weight="600" fill="#A5E7FF">logs/</text>
      <text x="286" y="218" class="sans" font-size="11.5" fill="#A3ACDA">boot.log and emulog.txt</text>
    </g>
  </g>

  <text x="600" y="410" text-anchor="middle" class="sans" font-size="11.5" fill="#7D88BC">Settings and NVRAM use atomic writes. Destructive actions default to Cancel.</text>
</svg>
