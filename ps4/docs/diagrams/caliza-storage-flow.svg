<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" width="1200" height="450" role="img" aria-label="Caliza console storage layout under /data/caliza showing read-only external folders and safe resumable migration">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#05071A"/>
      <stop offset="55%" stop-color="#090E30"/>
      <stop offset="100%" stop-color="#05081E"/>
    </linearGradient>
    <radialGradient id="glow" cx="72%" cy="52%" r="48%">
      <stop offset="0%" stop-color="#3340D0" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#05071A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0E1540" stop-opacity="0.94"/>
      <stop offset="100%" stop-color="#080C26" stop-opacity="0.94"/>
    </linearGradient>
    <marker id="arrIce" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#A5E7FF"/>
    </marker>
    <marker id="arrAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#FFD092"/>
    </marker>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="1199" height="449" rx="18" fill="url(#bg)" stroke="#8C9BFF" stroke-opacity="0.26"/>
  <rect x="1" y="1" width="1198" height="448" rx="18" fill="url(#glow)"/>

  <!-- Header -->
  <text x="48" y="46" class="sans" font-size="12" font-weight="700" letter-spacing="1.8" fill="#A5E7FF">CONSOLE DATA &amp; STORAGE POLICY</text>
  <text x="48" y="72" class="sans" font-size="22" font-weight="600" fill="#F2F5FF">One Canonical Data Root, Zero Touched Game Drives</text>
  <line x1="48" y1="88" x2="1152" y2="88" stroke="#8C9BFF" stroke-opacity="0.24"/>

  <!-- Left Card A: External Media -->
  <g transform="translate(48, 108)">
    <rect width="450" height="142" rx="12" fill="url(#card)" stroke="#8C9BFF" stroke-opacity="0.34"/>
    <rect x="0.5" y="16" width="3.5" height="32" rx="1.75" fill="#72E3B5"/>
    <text x="20" y="30" class="sans" font-size="15.5" font-weight="600" fill="#F2F5FF">External &amp; Network Game Folders</text>
    <text x="20" y="50" class="mono" font-size="11.5" fill="#A5E7FF">/mnt/usb0  ·  /mnt/ext0  ·  nfs://server/export</text>
    <circle cx="26" cy="76" r="3.5" fill="#72E3B5"/>
    <text x="38" y="80" class="sans" font-size="12.5" fill="#C9D3EC">Saved folders are links, never copies</text>
    <circle cx="26" cy="100" r="3.5" fill="#72E3B5"/>
    <text x="38" y="104" class="sans" font-size="12.5" fill="#C9D3EC">Drives are never written to or formatted on scan</text>
    <circle cx="26" cy="124" r="3.5" fill="#72E3B5"/>
    <text x="38" y="128" class="sans" font-size="12.5" fill="#C9D3EC">Unplugged volumes keep their library metadata</text>
  </g>

  <!-- Left Card B: Upgrade Migration -->
  <g transform="translate(48, 268)">
    <rect width="450" height="142" rx="12" fill="url(#card)" stroke="#FFD092" stroke-opacity="0.38"/>
    <rect x="0.5" y="16" width="3.5" height="32" rx="1.75" fill="#FFD092"/>
    <text x="20" y="30" class="sans" font-size="15.5" font-weight="600" fill="#F2F5FF">Upgrading From Earlier Builds</text>
    <text x="20" y="50" class="sans" font-size="12" fill="#FFD092">Automatic, resumable first-run migration</text>
    <circle cx="26" cy="76" r="3.5" fill="#FFD092"/>
    <text x="38" y="80" class="sans" font-size="12.5" fill="#C9D3EC">Copies BIOS, settings, cards &amp; small files once</text>
    <circle cx="26" cy="100" r="3.5" fill="#FFD092"/>
    <text x="38" y="104" class="sans" font-size="12.5" fill="#C9D3EC">Never overwrites existing files in /data/caliza/</text>
    <circle cx="26" cy="124" r="3.5" fill="#FFD092"/>
    <text x="38" y="128" class="sans" font-size="12.5" fill="#C9D3EC">Never deletes old roots; large games stay in place</text>
  </g>

  <!-- Connectors -->
  <g>
    <line x1="500" y1="179" x2="574" y2="179" stroke="#A5E7FF" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrIce)"/>
    <text x="537" y="166" text-anchor="middle" class="sans" font-size="11" font-weight="600" fill="#A5E7FF">Read-only</text>
    <text x="537" y="198" text-anchor="middle" class="sans" font-size="10.5" fill="#8E98CA">in place</text>

    <line x1="500" y1="339" x2="574" y2="339" stroke="#FFD092" stroke-width="2" marker-end="url(#arrAmber)"/>
    <text x="537" y="326" text-anchor="middle" class="sans" font-size="11" font-weight="600" fill="#FFD092">Safe copy</text>
    <text x="537" y="358" text-anchor="middle" class="sans" font-size="10.5" fill="#8E98CA">resumable</text>
  </g>

  <!-- Right Panel: /data/caliza/ -->
  <g transform="translate(578, 108)">
    <rect width="574" height="302" rx="14" fill="url(#card)" stroke="#7AA8FF" stroke-opacity="0.60" stroke-width="1.3"/>
    <rect x="0.5" y="16" width="3.5" height="36" rx="1.75" fill="#A5E7FF"/>
    <text x="20" y="31" class="mono" font-size="16.5" font-weight="700" fill="#F2F5FF">/data/caliza/</text>
    <text x="554" y="31" text-anchor="end" class="sans" font-size="12" fill="#A5E7FF">Canonical writable root</text>
    <line x1="18" y1="46" x2="556" y2="46" stroke="#8C9BFF" stroke-opacity="0.22"/>

    <!-- 2 columns x 4 rows -->
    <g transform="translate(18, 58)">
      <!-- Row 1 -->
      <rect x="0" y="0" width="262" height="50" rx="8" fill="#0B1134" stroke="#8C9BFF" stroke-opacity="0.24"/>
      <text x="12" y="21" class="mono" font-size="13" font-weight="700" fill="#A5E7FF">bios/</text>
      <text x="12" y="39" class="sans" font-size="11.5" fill="#A3ACDA">User-dumped PS2 BIOS images</text>

      <rect x="276" y="0" width="262" height="50" rx="8" fill="#0B1134" stroke="#8C9BFF" stroke-opacity="0.24"/>
      <text x="288" y="21" class="mono" font-size="13" font-weight="700" fill="#A5E7FF">games/</text>
      <text x="288" y="39" class="sans" font-size="11.5" fill="#A3ACDA">Default internal library folder</text>

      <!-- Row 2 -->
      <rect x="0" y="60" width="262" height="50" rx="8" fill="#0B1134" stroke="#8C9BFF" stroke-opacity="0.24"/>
      <text x="12" y="81" class="mono" font-size="13" font-weight="700" fill="#A5E7FF">memcards/</text>
      <text x="12" y="99" class="sans" font-size="11.5" fill="#A3ACDA">Global &amp; per-game memory cards</text>

      <rect x="276" y="60" width="262" height="50" rx="8" fill="#0B1134" stroke="#8C9BFF" stroke-opacity="0.24"/>
      <text x="288" y="81" class="mono" font-size="13" font-weight="700" fill="#A5E7FF">savestates/</text>
      <text x="288" y="99" class="sans" font-size="11.5" fill="#A3ACDA">Slot save states &amp; safe backups</text>

      <!-- Row 3 -->
      <rect x="0" y="120" width="262" height="50" rx="8" fill="#0B1134" stroke="#8C9BFF" stroke-opacity="0.24"/>
      <text x="12" y="141" class="mono" font-size="13" font-weight="700" fill="#A5E7FF">settings/</text>
      <text x="12" y="159" class="sans" font-size="11.5" fill="#A3ACDA">Atomic global &amp; per-game profiles</text>

      <rect x="276" y="120" width="262" height="50" rx="8" fill="#0B1134" stroke="#8C9BFF" stroke-opacity="0.24"/>
      <text x="288" y="141" class="mono" font-size="13" font-weight="700" fill="#A5E7FF">patches/</text>
      <text x="288" y="159" class="sans" font-size="11.5" fill="#A3ACDA">Widescreen &amp; game-fix patches</text>

      <!-- Row 4 -->
      <rect x="0" y="180" width="262" height="50" rx="8" fill="#0B1134" stroke="#8C9BFF" stroke-opacity="0.24"/>
      <text x="12" y="201" class="mono" font-size="13" font-weight="700" fill="#A5E7FF">textures/</text>
      <text x="12" y="219" class="sans" font-size="11.5" fill="#A3ACDA">Optional texture replacement packs</text>

      <rect x="276" y="180" width="262" height="50" rx="8" fill="#0B1134" stroke="#8C9BFF" stroke-opacity="0.24"/>
      <text x="288" y="201" class="mono" font-size="13" font-weight="700" fill="#A5E7FF">logs/</text>
      <text x="288" y="219" class="sans" font-size="11.5" fill="#A3ACDA">boot.log &amp; emulog.txt diagnostics</text>
    </g>
  </g>

  <text x="600" y="432" text-anchor="middle" class="sans" font-size="11.5" fill="#7D88BC">Settings and NVRAM use atomic writes · Destructive actions require confirmation with Cancel focused first</text>
</svg>
