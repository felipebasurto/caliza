<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 572" width="1200" height="572" role="img" aria-label="Caliza overview showing user storage, the PS4 emulator with its Estratos interface and PCSX2 core, and the LAN companion panel">
  <defs>
    <linearGradient id="logoTop" gradientUnits="userSpaceOnUse" x1="60.45" y1="8.26" x2="60.45" y2="60.26">
      <stop offset="0" stop-color="#F4FBFF"/>
      <stop offset="1" stop-color="#9EDFFF"/>
    </linearGradient>
    <linearGradient id="logoLeft" gradientUnits="userSpaceOnUse" x1="15.42" y1="34.26" x2="60.45" y2="112.26">
      <stop offset="0" stop-color="#A3CBFA"/>
      <stop offset="1" stop-color="#5470D8"/>
    </linearGradient>
    <linearGradient id="logoRight" gradientUnits="userSpaceOnUse" x1="60.45" y1="60.26" x2="105.48" y2="86.26">
      <stop offset="0" stop-color="#5163CF"/>
      <stop offset="1" stop-color="#27318D"/>
    </linearGradient>
    <marker id="arrowIce" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#A5E7FF"/>
    </marker>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    </style>
  </defs>

  <!-- Canvas -->
  <rect x="0.5" y="0.5" width="1199" height="571" rx="16" fill="#06081F" stroke="#8C9BFF" stroke-opacity="0.26"/>

  <!-- Header -->
  <g transform="translate(40, 24) scale(0.40)">
    <path d="M64.05 46.74 L109.09 72.74 L64.05 98.74 L19.02 72.74 Z" fill="url(#logoTop)"/>
    <path d="M19.02 72.74 L64.05 98.74 L64.05 114.34 L19.02 88.34 Z" fill="url(#logoLeft)"/>
    <path d="M64.05 98.74 L109.09 72.74 L109.09 88.34 L64.05 114.34 Z" fill="url(#logoRight)"/>
    <path d="M60.45 25.42 L105.48 51.42 L60.45 77.42 L15.42 51.42 Z" fill="url(#logoTop)"/>
    <path d="M15.42 51.42 L60.45 77.42 L60.45 93.54 L15.42 67.54 Z" fill="url(#logoLeft)"/>
    <path d="M60.45 77.42 L105.48 51.42 L105.48 67.54 L60.45 93.54 Z" fill="url(#logoRight)"/>
    <path d="M55.95 5.66 L100.98 31.66 L55.95 57.66 L10.91 31.66 Z" fill="url(#logoTop)"/>
    <path d="M10.91 31.66 L55.95 57.66 L55.95 71.70 L10.91 45.70 Z" fill="url(#logoLeft)"/>
    <path d="M55.95 57.66 L100.98 31.66 L100.98 45.70 L55.95 71.70 Z" fill="url(#logoRight)"/>
  </g>
  <text x="96" y="48" class="sans" font-size="20" font-weight="600" letter-spacing="2.5" fill="#F2F5FF">CALIZA</text>
  <text x="96" y="68" class="sans" font-size="13.5" fill="#A3ACDA">Native PlayStation 2 emulator for PS4, ported from PCSX2</text>
  <line x1="40" y1="88" x2="1160" y2="88" stroke="#8C9BFF" stroke-opacity="0.22"/>

  <!-- Column 1: Storage and BIOS -->
  <g transform="translate(40, 108)">
    <rect width="288" height="416" rx="12" fill="#0B1033" stroke="#8C9BFF" stroke-opacity="0.28"/>
    <text x="20" y="34" class="sans" font-size="16" font-weight="600" fill="#F2F5FF">Storage and BIOS</text>

    <g transform="translate(20, 52)">
      <rect width="248" height="54" rx="8" fill="#0E1540" stroke="#8C9BFF" stroke-opacity="0.22"/>
      <text x="14" y="23" class="sans" font-size="13.5" font-weight="600" fill="#F2F5FF">Internal storage</text>
      <text x="14" y="41" class="mono" font-size="11.5" fill="#A3ACDA">/data/caliza/bios and games</text>
    </g>

    <g transform="translate(20, 118)">
      <rect width="248" height="54" rx="8" fill="#0E1540" stroke="#8C9BFF" stroke-opacity="0.22"/>
      <text x="14" y="23" class="sans" font-size="13.5" font-weight="600" fill="#F2F5FF">USB drives</text>
      <text x="14" y="41" class="mono" font-size="11.5" fill="#A3ACDA">/mnt/usb0</text>
    </g>

    <g transform="translate(20, 184)">
      <rect width="248" height="54" rx="8" fill="#0E1540" stroke="#8C9BFF" stroke-opacity="0.22"/>
      <text x="14" y="23" class="sans" font-size="13.5" font-weight="600" fill="#F2F5FF">Extended and NFSv3</text>
      <text x="14" y="41" class="mono" font-size="11.5" fill="#A3ACDA">/mnt/ext0, nfs://server/share</text>
    </g>

    <g transform="translate(20, 256)" class="mono" font-size="12" font-weight="600">
      <rect x="0" y="0" width="56" height="28" rx="6" fill="#131B4A" stroke="#8C9BFF" stroke-opacity="0.30"/>
      <text x="28" y="18" text-anchor="middle" fill="#D4D9FF">.iso</text>
      <rect x="64" y="0" width="56" height="28" rx="6" fill="#131B4A" stroke="#8C9BFF" stroke-opacity="0.30"/>
      <text x="92" y="18" text-anchor="middle" fill="#D4D9FF">.chd</text>
      <rect x="128" y="0" width="56" height="28" rx="6" fill="#131B4A" stroke="#8C9BFF" stroke-opacity="0.30"/>
      <text x="156" y="18" text-anchor="middle" fill="#D4D9FF">.cso</text>
      <rect x="192" y="0" width="56" height="28" rx="6" fill="#131B4A" stroke="#8C9BFF" stroke-opacity="0.30"/>
      <text x="220" y="18" text-anchor="middle" fill="#D4D9FF">.zso</text>
    </g>

    <rect x="20" y="304" width="248" height="92" rx="8" fill="#0A1728" stroke="#72E3B5" stroke-opacity="0.32"/>
    <text x="34" y="328" class="sans" font-size="13" font-weight="600" fill="#72E3B5">Read in place</text>
    <text x="34" y="350" class="sans" font-size="12" fill="#C4D4DF">Caliza never moves, formats,</text>
    <text x="34" y="368" class="sans" font-size="12" fill="#C4D4DF">or writes to game drives.</text>
    <text x="34" y="386" class="sans" font-size="11.5" fill="#8E98CA">User supplies BIOS and discs.</text>
  </g>

  <!-- Connector 1 -> 2 -->
  <g>
    <line x1="330" y1="316" x2="372" y2="316" stroke="#A5E7FF" stroke-width="1.8" marker-end="url(#arrowIce)"/>
    <text x="351" y="304" text-anchor="middle" class="sans" font-size="11" font-weight="600" fill="#A5E7FF">Read</text>
  </g>

  <!-- Column 2: Caliza on PS4 -->
  <g transform="translate(376, 108)">
    <rect width="456" height="416" rx="12" fill="#0E1540" stroke="#7AA8FF" stroke-opacity="0.58" stroke-width="1.2"/>
    <text x="20" y="34" class="sans" font-size="16" font-weight="600" fill="#F2F5FF">Caliza on PS4</text>
    <text x="436" y="34" text-anchor="end" class="mono" font-size="11.5" fill="#A3ACDA">1080p / 720p</text>

    <!-- Upper block: Estratos TV interface -->
    <rect x="20" y="52" width="416" height="176" rx="10" fill="#080D2B" stroke="#8C9BFF" stroke-opacity="0.30"/>
    <text x="36" y="76" class="sans" font-size="13.5" font-weight="600" fill="#F2F5FF">Estratos interface</text>
    <text x="420" y="76" text-anchor="end" class="mono" font-size="11.5" fill="#A3ACDA">Vulkan 2D</text>
    <line x1="36" y1="88" x2="420" y2="88" stroke="#8C9BFF" stroke-opacity="0.20"/>

    <!-- Nav rail schematic (uses real Estratos focus bar) -->
    <g transform="translate(36, 100)">
      <rect width="110" height="114" rx="6" fill="#060A22" stroke="#8C9BFF" stroke-opacity="0.22"/>
      <rect x="6" y="6" width="98" height="20" rx="4" fill="#1A2B68"/>
      <rect x="6" y="6" width="3" height="20" rx="1.5" fill="#A5E7FF"/>
      <text x="15" y="20" class="sans" font-size="11" font-weight="600" fill="#F2F5FF">Continue</text>
      <text x="15" y="39" class="sans" font-size="11" fill="#A3ACDA">Library</text>
      <text x="15" y="56" class="sans" font-size="11" fill="#A3ACDA">Memory cards</text>
      <text x="15" y="73" class="sans" font-size="11" fill="#A3ACDA">Settings</text>
      <text x="15" y="90" class="sans" font-size="11" fill="#A3ACDA">Accessibility</text>
      <text x="15" y="106" class="sans" font-size="10.5" fill="#7D88BC">Diagnostics</text>
    </g>

    <!-- Feature tiles -->
    <g transform="translate(158, 100)">
      <rect x="0" y="0" width="126" height="52" rx="6" fill="#0E1540" stroke="#8C9BFF" stroke-opacity="0.24"/>
      <text x="10" y="20" class="sans" font-size="12" font-weight="600" fill="#F2F5FF">Library</text>
      <text x="10" y="37" class="sans" font-size="10.5" fill="#A3ACDA">Filters and search</text>

      <rect x="136" y="0" width="126" height="52" rx="6" fill="#0E1540" stroke="#8C9BFF" stroke-opacity="0.24"/>
      <text x="146" y="20" class="sans" font-size="12" font-weight="600" fill="#F2F5FF">Settings</text>
      <text x="146" y="37" class="sans" font-size="10.5" fill="#A3ACDA">Global and per-game</text>

      <rect x="0" y="62" width="126" height="52" rx="6" fill="#0E1540" stroke="#8C9BFF" stroke-opacity="0.24"/>
      <text x="10" y="82" class="sans" font-size="12" font-weight="600" fill="#F2F5FF">Cards and states</text>
      <text x="10" y="99" class="sans" font-size="10.5" fill="#A3ACDA">Slots and shortcuts</text>

      <rect x="136" y="62" width="126" height="52" rx="6" fill="#0E1540" stroke="#8C9BFF" stroke-opacity="0.24"/>
      <text x="146" y="82" class="sans" font-size="12" font-weight="600" fill="#F2F5FF">Accessibility</text>
      <text x="146" y="99" class="sans" font-size="10.5" fill="#A3ACDA">100 to 200% text</text>
    </g>

    <!-- Contract bar -->
    <rect x="64" y="240" width="328" height="24" rx="6" fill="#132258" stroke="#A5E7FF" stroke-opacity="0.45"/>
    <text x="228" y="256" text-anchor="middle" class="mono" font-size="11" font-weight="600" fill="#A5E7FF">Snapshot up, commands down (contract.h)</text>

    <!-- Lower block: PCSX2 core -->
    <rect x="20" y="276" width="416" height="120" rx="10" fill="#080D2B" stroke="#8C9BFF" stroke-opacity="0.30"/>
    <text x="36" y="300" class="sans" font-size="13.5" font-weight="600" fill="#F2F5FF">PCSX2 core and Orbis layer</text>
    <text x="420" y="300" text-anchor="end" class="mono" font-size="11.5" fill="#A3ACDA">OpenOrbis</text>
    <line x1="36" y1="312" x2="420" y2="312" stroke="#8C9BFF" stroke-opacity="0.20"/>

    <g transform="translate(36, 324)">
      <rect x="0" y="0" width="120" height="58" rx="6" fill="#0E1540" stroke="#8C9BFF" stroke-opacity="0.22"/>
      <text x="10" y="20" class="sans" font-size="12" font-weight="600" fill="#D4D9FF">CPU and memory</text>
      <text x="10" y="36" class="mono" font-size="10.5" fill="#A3ACDA">EE, IOP, VU</text>
      <text x="10" y="50" class="sans" font-size="10.5" fill="#8E98CA">MTVU and fallback</text>

      <rect x="132" y="0" width="120" height="58" rx="6" fill="#0E1540" stroke="#8C9BFF" stroke-opacity="0.22"/>
      <text x="142" y="20" class="sans" font-size="12" font-weight="600" fill="#D4D9FF">Graphics</text>
      <text x="142" y="36" class="mono" font-size="10.5" fill="#A5E7FF">Vulkan RADV</text>
      <text x="142" y="50" class="sans" font-size="10.5" fill="#8E98CA">paraLLEl-GS or SW</text>

      <rect x="264" y="0" width="120" height="58" rx="6" fill="#0E1540" stroke="#8C9BFF" stroke-opacity="0.22"/>
      <text x="274" y="20" class="sans" font-size="12" font-weight="600" fill="#D4D9FF">Audio and I/O</text>
      <text x="274" y="36" class="mono" font-size="10.5" fill="#A3ACDA">SPU2, CDVD</text>
      <text x="274" y="50" class="sans" font-size="10.5" fill="#8E98CA">Atomic saves</text>
    </g>
  </g>

  <!-- Connector 2 <-> 3 -->
  <g>
    <line x1="836" y1="316" x2="876" y2="316" stroke="#A5E7FF" stroke-width="1.8" marker-start="url(#arrowIce)" marker-end="url(#arrowIce)"/>
    <text x="856" y="304" text-anchor="middle" class="sans" font-size="11" font-weight="600" fill="#A5E7FF">LAN</text>
  </g>

  <!-- Column 3: Companion panel -->
  <g transform="translate(880, 108)">
    <rect width="280" height="416" rx="12" fill="#0B1033" stroke="#8C9BFF" stroke-opacity="0.28"/>
    <text x="20" y="34" class="sans" font-size="16" font-weight="600" fill="#F2F5FF">Companion panel</text>

    <rect x="20" y="52" width="240" height="240" rx="8" fill="#080D2B" stroke="#8C9BFF" stroke-opacity="0.24"/>
    <rect x="32" y="64" width="216" height="24" rx="6" fill="#101846" stroke="#8C9BFF" stroke-opacity="0.22"/>
    <text x="44" y="80" class="mono" font-size="11.5" fill="#A5E7FF">https://&lt;console-ip&gt;</text>

    <g transform="translate(32, 100)">
      <rect width="216" height="40" rx="6" fill="#0E1540" stroke="#8C9BFF" stroke-opacity="0.20"/>
      <text x="12" y="17" class="sans" font-size="12.5" font-weight="600" fill="#F2F5FF">Browse library</text>
      <text x="12" y="32" class="sans" font-size="11" fill="#A3ACDA">Serials, folders, and status</text>
    </g>
    <g transform="translate(32, 148)">
      <rect width="216" height="40" rx="6" fill="#0E1540" stroke="#8C9BFF" stroke-opacity="0.20"/>
      <text x="12" y="17" class="sans" font-size="12.5" font-weight="600" fill="#F2F5FF">Edit settings</text>
      <text x="12" y="32" class="sans" font-size="11" fill="#A3ACDA">Global and per-game options</text>
    </g>
    <g transform="translate(32, 196)">
      <rect width="216" height="40" rx="6" fill="#0E1540" stroke="#8C9BFF" stroke-opacity="0.20"/>
      <text x="12" y="17" class="sans" font-size="12.5" font-weight="600" fill="#F2F5FF">Manage folders</text>
      <text x="12" y="32" class="sans" font-size="11" fill="#A3ACDA">Sources, cards, and packs</text>
    </g>
    <g transform="translate(32, 244)">
      <rect width="216" height="36" rx="6" fill="#0E1540" stroke="#8C9BFF" stroke-opacity="0.20"/>
      <text x="12" y="16" class="sans" font-size="12.5" font-weight="600" fill="#F2F5FF">Export diagnostics</text>
      <text x="12" y="30" class="sans" font-size="11" fill="#A3ACDA">boot.log and emulog.txt</text>
    </g>

    <rect x="20" y="304" width="240" height="92" rx="8" fill="#0E1540" stroke="#8C9BFF" stroke-opacity="0.24"/>
    <g transform="translate(36, 325)" fill="#D4D9FF">
      <rect x="0" y="0" width="16" height="16" rx="2" fill="none" stroke="#A5E7FF" stroke-width="2.2"/>
      <rect x="5" y="5" width="6" height="6" fill="#A5E7FF"/>
      <rect x="34" y="0" width="16" height="16" rx="2" fill="none" stroke="#A5E7FF" stroke-width="2.2"/>
      <rect x="39" y="5" width="6" height="6" fill="#A5E7FF"/>
      <rect x="0" y="34" width="16" height="16" rx="2" fill="none" stroke="#A5E7FF" stroke-width="2.2"/>
      <rect x="5" y="39" width="6" height="6" fill="#A5E7FF"/>
      <rect x="22" y="4" width="6" height="6"/>
      <rect x="22" y="16" width="6" height="12"/>
      <rect x="4" y="22" width="12" height="6"/>
      <rect x="34" y="22" width="6" height="6"/>
      <rect x="44" y="22" width="6" height="12"/>
      <rect x="22" y="34" width="12" height="6"/>
      <rect x="38" y="38" width="12" height="12"/>
      <rect x="22" y="44" width="10" height="6"/>
    </g>
    <text x="100" y="340" class="sans" font-size="12.5" font-weight="600" fill="#F2F5FF">Open via QR code</text>
    <text x="100" y="358" class="sans" font-size="11.5" fill="#A3ACDA">Diagnostics screen, or hold</text>
    <text x="100" y="374" class="mono" font-size="11" fill="#A5E7FF">L2 + D-pad Down (2s)</text>
  </g>

  <text x="600" y="550" text-anchor="middle" class="sans" font-size="11.5" fill="#7D88BC">GPLv3+ open-source software. Includes no BIOS, keys, or game files. Not affiliated with Sony Interactive Entertainment or PCSX2.</text>
</svg>
