<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 58" width="360" height="58" role="img" aria-label="Download Latest Release (PS4 .pkg)">
  <defs>
    <linearGradient id="btnBg" x1="0" y1="0" x2="360" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2952CC"/>
      <stop offset="55%" stop-color="#1E3BA8"/>
      <stop offset="100%" stop-color="#142675"/>
    </linearGradient>
    <linearGradient id="btnRim" x1="0" y1="0" x2="0" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A5E7FF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#6F95FF" stop-opacity="0.75"/>
    </linearGradient>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    </style>
  </defs>

  <!-- Button body -->
  <rect x="1.5" y="1.5" width="357" height="55" rx="12" fill="url(#btnBg)" stroke="url(#btnRim)" stroke-width="1.6"/>
  <!-- Subtle Estratos left ice accent -->
  <rect x="2" y="13" width="4" height="32" rx="2" fill="#A5E7FF"/>

  <!-- Download icon -->
  <g transform="translate(26, 16)" fill="none" stroke="#F4FBFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2 L12 16"/>
    <path d="M6.5 11.5 L12 17 L17.5 11.5"/>
    <path d="M4 21.5 L20 21.5"/>
  </g>

  <!-- Label -->
  <text x="64" y="34.5" class="sans" font-size="16.5" font-weight="700" fill="#F4FBFF">Download Latest Release</text>

  <!-- Format pill -->
  <rect x="286" y="16" width="54" height="26" rx="7" fill="#0A1442" stroke="#A5E7FF" stroke-opacity="0.55"/>
  <text x="313" y="33" text-anchor="middle" class="mono" font-size="12" font-weight="700" fill="#A5E7FF">.pkg</text>
</svg>
